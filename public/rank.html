<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankerer</title>
    <style>
        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 96vh;
        }
        
        #general {
            display: flex;
            flex-direction: row;
            padding: 20px;
            
            background-color: #252525;
            width: 600px;
            border-radius: 30px;
            box-shadow: 0px 0px 20px 3px black;
        }
        #general #displayIcon {
            width: 200px;
        }
        #general div {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #general div #rank {
            font-family: Helvetica;
            font-weight: bold;
            font-size: 3.5rem;
            color: white;
        }
        #general div #sobstatusc {
            display: flex;
            flex-direction: row;
        }
        #general div #sobstatusc #rr {
            margin-bottom: 15px;
            margin-top: -15px;
            font-weight: bold;
            font-family: Helvetica;
            color: white;
            margin-left: 20px;
            margin-right: 10px;
            padding: 5px;
            border: 1px solid gray;
            border-radius: 5px;
            transition: all 0.3s ease-in-out;
        }
        #general div #sobstatusc #statusc {
            width: 250px;
            background-color: #454545;
            margin-top: -15px;
            margin-bottom: 15px;
            color: white;
            border-radius: 30px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: start;
        }
        #general div #sobstatusc #statusc #status-bar {
            background-color: white;
            width: 0%;
            height: 10px;
            border-radius: 30px;
        }
        #general div #name {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
        }
    </style>
</head>
<body>

    <div id="general">
        <img 
            src="https://cdn3.emoji.gg/emojis/9768_Radiant_Valorant.png" 
            alt=""
            id="displayIcon"
        >
        <div>
            <h3 id="rank">
                RANK
            </h3>
            <div id="sobstatusc">
                <div id="statusc">
                    <span id="status-bar">
                        
                    </span>
                </div>
                <span id="rr">
                    0/100
                </span>
            </div>
            <span id="name">
                Name#Tag
            </span>
        </div>
    </div>
    

    <script>
        function get(element) {
            return document.getElementById(element)
        }

        function getValueOf(element) {
            return get(element).value
        }

        const uparams = new URLSearchParams(window.location.search)
        const vname = uparams.get('name')
        const vtag = uparams.get('tag')

        async function update() {
            const response = await fetch(`https://api.henrikdev.xyz/valorant/v2/mmr/eu/${vname}/${vtag}?api_key=HDEV-11de0db4-959b-44b0-a1e6-c1c191922deb`, {
                method: 'GET',
                headers: {},
            });

            const data = await response.json()
            console.log(data)

            const currentstr = data.data.current_data.currenttierpatched
            const currentelo = data.data.current_data.elo 
            console.log(currentelo)
            console.log(currentstr.toLowerCase())
            const cw = currentstr.toLowerCase()
            const indexBased = String(currentelo).slice(1)
            const indexBased2 = String(currentelo).slice(2)
            const currentrr = Number(indexBased)
            const currentrr2 = Number(indexBased2)
            get('rank').innerText = currentstr.toUpperCase()
            get('displayIcon').src = data.data.current_data.images.large
            get('name').innerText = `${data.data.name}#${data.data.tag}`

            if (cw.includes('iron') || cw.includes('bronze') || cw.includes('silver') || cw.includes('gold 1')) {
                get('status-bar').style.width = `${currentrr}%`
                get('rr').innerText = `${currentrr}/100`
            } else if (cw.includes('gold 2') || cw.includes('gold 3') || cw.includes('platinum') || cw.includes('diamond') || cw.includes('ascendant') || cw.includes('inmortal')) {
                get('status-bar').style.width = `${currentrr2}%`
                get('rr').innerText = `${currentrr2}/100`
            }
        }

        update()

        setInterval(update, 120000)
    </script>
</body>
</html>
